<text x="48" y="286" font-size="20" fill="#2f2a1a" font-weight="600" text-anchor="start" >Accuracy with the mouth hidden</text>
<text x="48" y="314" font-size="15" fill="#6e6857" font-weight="400" text-anchor="start" >Cutout training stops it relying on the mouth</text>
