<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="608" viewBox="0 0 1000 608" font-family="'Google Sans','Product Sans','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Accuracy improvements from each training fix">
<title>Accuracy improvements from each training fix</title>
<rect width="1000" height="608" rx="28" fill="#f6f2e7"/>
