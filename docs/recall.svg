<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="'Google Sans','Product Sans','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Per-expression recall on FER+ and AffectNet test faces">
<title>Per-expression recall on FER+ and AffectNet test faces</title>
<rect width="1000" height="560" rx="28" fill="#f6f2e7"/>
<text x="48" y="62" font-size="30" fill="#2f2a1a" font-weight="700" text-anchor="start" >Per-expression recall</text>
<text x="48" y="96" font-size="17" fill="#6e6857" font-weight="400" text-anchor="start" >Share of each expression read correctly on faces the model never saw (flip-averaged)</text>
<rect x="48" y="124" width="18" height="18" rx="5" fill="#2f2a1a"/>
<text x="74" y="139" font-size="16" fill="#2f2a1a" font-weight="400" text-anchor="start" >FER+ test</text>
<rect x="178" y="124" width="18" height="18" rx="5" fill="#2f2a1a" opacity=".35"/>
<text x="204" y="139" font-size="16" fill="#2f2a1a" font-weight="400" text-anchor="start" >AffectNet (in the wild)</text>
<line x1="210" y1="168" x2="210" y2="510" stroke="#ddd3b8" stroke-dasharray="0"/>
<text x="210" y="534" font-size="14" fill="#6e6857" font-weight="400" text-anchor="middle" >0%</text>
<line x1="382" y1="168" x2="382" y2="510" stroke="#ddd3b8" stroke-dasharray="3 5"/>
<text x="382" y="534" font-size="14" fill="#6e6857" font-weight="400" text-anchor="middle" >25%</text>
<line x1="555" y1="168" x2="555" y2="510" stroke="#ddd3b8" stroke-dasharray="3 5"/>
<text x="555" y="534" font-size="14" fill="#6e6857" font-weight="400" text-anchor="middle" >50%</text>
<line x1="728" y1="168" x2="728" y2="510" stroke="#ddd3b8" stroke-dasharray="3 5"/>
<text x="728" y="534" font-size="14" fill="#6e6857" font-weight="400" text-anchor="middle" >75%</text>
<line x1="900" y1="168" x2="900" y2="510" stroke="#ddd3b8" stroke-dasharray="3 5"/>
<text x="900" y="534" font-size="14" fill="#6e6857" font-weight="400" text-anchor="middle" >100%</text>
<circle cx="62" cy="206" r="9" fill="#cf5d4c"/>
<text x="82" y="212" font-size="20" fill="#2f2a1a" font-weight="600" text-anchor="start" >Angry</text>
<rect x="210" y="182" width="531" height="24" rx="8" fill="#cf5d4c" opacity="1"/>
<text x="751" y="200" font-size="16" fill="#2f2a1a" font-weight="600" text-anchor="start" >77%</text>
<rect x="210" y="212" width="483" height="24" rx="8" fill="#cf5d4c" opacity="0.4"/>
<text x="703" y="230" font-size="16" fill="#2f2a1a" font-weight="600" text-anchor="start" >70%</text>
<circle cx="62" cy="292" r="9" fill="#d6962a"/>
<text x="82" y="298" font-size="20" fill="#2f2a1a" font-weight="600" text-anchor="start" >Happy</text>
<rect x="210" y="268" width="621" height="24" rx="8" fill="#d6962a" opacity="1"/>
<text x="841" y="286" font-size="16" fill="#2f2a1a" font-weight="600" text-anchor="start" >90%</text>
<rect x="210" y="298" width="621" height="24" rx="8" fill="#d6962a" opacity="0.4"/>
<text x="841" y="316" font-size="16" fill="#2f2a1a" font-weight="600" text-anchor="start" >90%</text>
<circle cx="62" cy="378" r="9" fill="#6f8a82"/>
<text x="82" y="384" font-size="20" fill="#2f2a1a" font-weight="600" text-anchor="start" >Neutral</text>
<rect x="210" y="354" width="621" height="24" rx="8" fill="#6f8a82" opacity="1"/>
<text x="841" y="372" font-size="16" fill="#2f2a1a" font-weight="600" text-anchor="start" >90%</text>
<rect x="210" y="384" width="621" height="24" rx="8" fill="#6f8a82" opacity="0.4"/>
<text x="841" y="402" font-size="16" fill="#2f2a1a" font-weight="600" text-anchor="start" >90%</text>
<circle cx="62" cy="464" r="9" fill="#8466d2"/>
<text x="82" y="470" font-size="20" fill="#2f2a1a" font-weight="600" text-anchor="start" >Surprised</text>
<rect x="210" y="440" width="635" height="24" rx="8" fill="#8466d2" opacity="1"/>
<text x="855" y="458" font-size="16" fill="#2f2a1a" font-weight="600" text-anchor="start" >92%</text>
<rect x="210" y="470" width="469" height="24" rx="8" fill="#8466d2" opacity="0.4"/>
<text x="689" y="488" font-size="16" fill="#2f2a1a" font-weight="600" text-anchor="start" >68%</text>
</svg>
